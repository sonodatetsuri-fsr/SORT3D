services:
  ubuntu22_ros:
    image: nzantout/sort3d:cuda12.1_ubuntu22_ros
    container_name: ubuntu22_ros
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /home/tetsursonoda/Projects/SORT3D
    network_mode: "host"
    ipc: "host"
    # Enabling Nvidia GPUs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Environment variables passed to the container
    environment:
      - "DISPLAY"
      - "QT_X11_NO_MITSHM=1"
      - XAUTHORITY=/tmp/.docker.xauth
      - HOST_USER=tetsursonoda
    # This mounts the host directories into the container
    volumes:
      # This mounts the X11 socket into the container so that GUIs can be displayed
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb:rw
      - /home/tetsursonoda:/home/tetsursonoda:rw
